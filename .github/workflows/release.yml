name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: python dist/gateway-cli.pyz --version
      - if: runner.os != 'Windows'
        shell: bash
        run: HOME="$RUNNER_TEMP/axurion-smoke" bash install.sh --offline --no-setup
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AXURION_HOME = Join-Path $env:RUNNER_TEMP 'axurion-smoke'
          ./install.ps1 -Offline -NoSetup
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - name: Verify release version and create checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(python dist/gateway-cli.pyz --version)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -F "VERSION='$version'" install.sh
          grep -F "\$Version = '$version'" install.ps1
          (cd dist && sha256sum gateway-cli.pyz > gateway-cli.pyz.sha256)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/gateway-cli.pyz dist/gateway-cli.pyz.sha256 install.sh install.ps1
